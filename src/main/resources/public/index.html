<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom — A Habit Garden</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bloom.css" rel="stylesheet">
    <link href="css/garden.css" rel="stylesheet">
    <link href="css/animations.css" rel="stylesheet">
</head>
<body>
<div class="main-container">

    <header class="app-header">
        <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
            <div>
                <h1 class="title">🌱 Bloom</h1>
                <p class="tagline">A habit garden — watch your small wins grow.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-light" id="new-habit-btn">+ Plant a habit</button>
            </div>
        </div>
    </header>

    <section class="container py-4">
        <div id="stats-header" class="stats-header" hidden></div>
        <div id="garden-grid" class="garden-grid" hidden></div>
        <div id="empty-state" class="empty-state" hidden>
            <div class="empty-state-inner">
                <div class="empty-state-icon">🌱</div>
                <h2>Your garden is empty</h2>
                <p>Plant your first habit to get started.</p>
                <button class="btn btn-primary btn-lg" id="empty-state-btn">+ Plant a habit</button>
            </div>
        </div>
    </section>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
